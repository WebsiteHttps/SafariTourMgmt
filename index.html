const N=(n,l,v,s)=>`<div><label>${l}</label><input name="${n}" type="number" step="${s||'any'}" min="0" value="${v}"></div>`,P=(n,l,v)=>N(n,l,+(v*100).toFixed(2));
const ex=Array.from({length:Math.max(1,b.extras.length)},(_,i)=>exRow(i,b.extras[i]?.d,b.extras[i]?.u)).join('');
$('#dlg').innerHTML=`<form onsubmit="return false" oninput="live()"><h2>${id?'Edit':'New'} Quotation · ${b.id}</h2>
<h3>Tour / Trip</h3><div class="grid"><div><label>Client *</label>${sel('client',names(db.clients),b.client,1)}</div>${N('group','Group Size',b.group,1)}
<div><label>Tour/Trip *</label>${sel('tour',names(db.tours),b.tour,1)}</div><div><label>Season</label>${sel('season',SEASONS,b.season)}</div>
<div><label>Start Date</label><input name="start" type="date" value="${b.start}"></div><div><label>End Date</label><input name="end" type="date" value="${b.end}"></div>${P('mk','Tour Markup %',b.mk)}</div>
<h3>Transportation</h3><div class="grid"><div><label>Land vendor</label>${sel('lv',names(db.vendors.filter(v=>v.category=='Land transport')),b.lv,1)}</div>${N('lm','Land multiplier',b.lm)}${P('lmk','Land markup %',b.lmk)}
<div><label>Air vendor</label>${sel('av',names(db.vendors.filter(v=>v.category=='Air transport')),b.av,1)}</div>${N('am','Air multiplier',b.am)}${P('amk','Air markup %',b.amk)}</div>
<h3>Extra details</h3><div class="grid"><div><label>Guide</label>${sel('guide',names(db.employees.filter(e=>/guide/i.test(e.role))),b.guide,1)}</div><div><label>Driver</label>${sel('driver',names(db.employees.filter(e=>e.role=='Driver')),b.driver,1)}</div><div><label>Vehicle</label>${sel('vehicle',names(db.assets.filter(a=>a.category=='Vehicle')),b.vehicle,1)}</div></div>
<h3>Multi-day fees (unit cost × group × days)</h3><div id="exs">${ex}</div><div class="bar" style="margin-top:8px"><button type="button" class="btn g s" onclick="addEx()">+ Add</button><button type="button" class="btn g s" onclick="rmEx()">− Remove</button></div>
<div class="grid" style="margin-top:10px">${P('disc','Discount %',b.disc)}<div><label>Status</label>${sel('status',STAT,b.status)}</div></div><div class="sum" id="sum"></div>
<div class="bar" style="margin-top:14px;justify-content:flex-end"><button class="btn g" onclick="$('#dlg').close()">Cancel</button><button class="btn g" onclick="printQ(null,collect('${b.id}'))">Print</button><button class="btn" onclick="saveB('${b.id}',${!!id})">Save</button></div></form>`;$('#dlg').showModal();live()}
function collect(id){const f=$('#dlg form').elements,v=n=>f[n].value,p=n=>(+v(n)||0)/100;
return{id,client:v('client'),group:+v('group')||1,tour:v('tour'),season:v('season'),start:v('start'),end:v('end'),mk:p('mk'),lv:v('lv'),lm:+v('lm')||1,lmk:p('lmk'),av:v('av'),am:+v('am')||1,amk:p('amk'),
extras:Array.from({length:$$('#exs .ex').length},(_,i)=>({d:v('d'+i),u:+v('u'+i)||0})).filter(x=>x.d||x.u),disc:p('disc'),guide:v('guide'),driver:v('driver'),vehicle:v('vehicle'),status:v('status')}}
function live(){const b=collect('x'),c=calc(b),row=(l,v)=>`<div><span>${l}</span><span>${money(v)}</span></div>`;
$$('.xt').forEach((e,i)=>e.value=money((+$('#dlg form').elements['u'+i].value||0)*Math.max(b.group,1)*c.days));
$('#sum').innerHTML=`<div><span>Season price · ${c.days} day(s) · ${esc(c.type)}</span><span>${money(c.sp)}</span></div>${row('Tour/Trip price',c.trip)}${row('After markup',c.tripM)}${row('Land transport (cost → after markup)',c.lcM)}${row('Air transport (after markup)',c.acM)}${row('Multi-day fees',c.multi)}${row('Subtotal',c.sub)}<div class="t"><span>Total after discount</span><span>${money(c.total)}</span></div>`}
function saveB(id,isEdit){const b=collect(id);if(!b.client||!b.tour){toast('Client and Tour/Trip are required');return}
if(isEdit)db.bookings=db.bookings.map(x=>x.id==id?b:x);else db.bookings.push(b);save();cloudUp('bookings',b);$('#dlg').close();bookList();toast('Saved')}
function delB(id){if(confirm('Delete '+id+'?')){db.bookings=db.bookings.filter(x=>x.id!=id);save();cloudDel('bookings',id);bookList();toast('Deleted')}}
function printMany(ids){const bs=ids.map(i=>db.bookings.find(x=>x.id==i)).filter(Boolean);if(!bs.length)return;
const w=open('','_blank');if(!w){toast('Allow pop-ups to print');return}
w.document.write('<title>Quotations</title><body style="font:14px system-ui;max-width:720px;margin:30px auto">'+bs.map((b,i)=>`<div style="${i?'page-break-before:always;':''}">${qDoc(b)}</div>`).join('')+'<script>print()<\/script>');w.document.close()}
function qDoc(b){const c=calc(b),r=(l,v)=>`<tr><td>${l}</td><td style="text-align:right">${money(v)}</td></tr>`,cl=db.clients.find(x=>x.name==b.client);
return`<h1>Quotation ${b.id}</h1><p><b>${esc(b.client)}</b><br>${esc(cl?.email||'')} ${esc(cl?.phone||'')}</p>
<p>${esc(b.tour)} (${esc(c.type)})<br>${b.season} · ${b.start||''} → ${b.end||''} · ${c.days} day(s) · Group of ${b.group}<br>Guide: ${esc(b.guide)} · Driver: ${esc(b.driver)} · Vehicle: ${esc(b.vehicle)}</p>
<table width="100%" border="1" cellspacing="0" cellpadding="6">${r('Tour/Trip',c.tripM)}${b.lv?r('Land transport – '+esc(b.lv),c.lcM):''}${b.av?r('Air transport – '+esc(b.av),c.acM):''}${b.extras.map(x=>r(esc(x.d||'Additional fee'),x.u*Math.max(b.group,1)*c.days)).join('')}${b.disc?r('Discount ('+(b.disc*100)+'%)',-c.sub*b.disc):''}<tr><th>Total</th><th style="text-align:right">${money(c.total)}</th></tr></table>`}
function printQ(id,b){b=b||db.bookings.find(x=>x.id==id);const c=calc(b),r=(l,v)=>`<tr><td>${l}</td><td style="text-align:right">${money(v)}</td></tr>`,cl=db.clients.find(x=>x.name==b.client);
const w=open('','_blank');w.document.write(`<title>Quotation ${b.id}</title><body style="font:14px system-ui;max-width:720px;margin:30px auto"><h1>Quotation ${b.id}</h1><p><b>${esc(b.client)}</b><br>${esc(cl?.email||'')} ${esc(cl?.phone||'')}</p>
<p>${esc(b.tour)} (${esc(c.type)})<br>${b.season} · ${b.start||''} → ${b.end||''} · ${c.days} day(s) · Group of ${b.group}<br>Guide: ${esc(b.guide)} · Driver: ${esc(b.driver)} · Vehicle: ${esc(b.vehicle)}</p>
<table width="100%" border="1" cellspacing="0" cellpadding="6">${r('Tour/Trip',c.tripM)}${b.lv?r('Land transport – '+esc(b.lv),c.lcM):''}${b.av?r('Air transport – '+esc(b.av),c.acM):''}${b.extras.map(x=>r(esc(x.d||'Additional fee'),x.u*Math.max(b.group,1)*c.days)).join('')}${b.disc?r('Discount ('+(b.disc*100)+'%)',-c.sub*b.disc):''}<tr><th>Total</th><th style="text-align:right">${money(c.total)}</th></tr></table><script>print()<\/script>`);w.document.close()}
/* ---- Supabase cloud (optional) ---- */
const MAP={clients:{},employees:{},vendors:{},tours:{low:'low_price',shoulder:'shoulder_price',high:'high_price'},assets:{bought:'purchase_date'},accounting:{date:'acc_date',ref:'reference'},bookings:{client:'client_name',group:'group_size',tour:'tour_name',start:'start_date',end:'end_date',mk:'markup',lv:'land_vendor',lm:'land_mult',lmk:'land_markup',av:'air_vendor',am:'air_mult',amk:'air_markup',disc:'discount'}};
const DATES=['purchase_date','acc_date','start_date','end_date'],TBL=k=>'safari_'+k;
const toDB=(k,r)=>{const o={};for(const[a,v]of Object.entries(r)){const c=MAP[k][a]||a;o[c]=DATES.includes(c)&&v===''?null:v}return o};
const fromDB=(k,r)=>{const inv=Object.fromEntries(Object.entries(MAP[k]).map(([a,b])=>[b,a])),o={};for(const[c,v]of Object.entries(r))o[inv[c]||c]=v??'';if(k=='bookings')o.extras=r.extras||[];return o};
let SB=null;try{SB=JSON.parse(localStorage.getItem('safari_sb'))}catch(e){}
async function sb(path,opt={}){const r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/'+path,{...opt,headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error((await r.text()).slice(0,160));const t=await r.text();return t?JSON.parse(t):null}
function status(s,m){$('#st').className='dot '+s;$('#stt').textContent=m}
async function cloudUp(k,rec){if(!SB)return;try{await sb(TBL(k),{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([toDB(k,rec)])});status('ok','Cloud synced')}catch(e){status('err','Cloud error');toast('Cloud: '+e.message)}}
async function cloudDel(k,id){if(!SB)return;try{await sb(TBL(k)+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});status('ok','Cloud synced')}catch(e){status('err','Cloud error');toast('Cloud: '+e.message)}}
async function cloudPushAll(){for(const k of Object.keys(MAP)){await sb(TBL(k)+'?id=neq.__none__',{method:'DELETE',headers:{Prefer:'return=minimal'}});if(db[k].length)await sb(TBL(k),{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(db[k].map(r=>toDB(k,r)))})}}
async function initCloud(){if(!SB){status('off','Local only');return}status('off','Connecting…');
try{const d={};for(const k of Object.keys(MAP))d[k]=(await sb(TBL(k)+'?select=*&order=id')).map(r=>fromDB(k,r));
const empty=Object.values(d).every(a=>!a.length);if(empty){if(confirm('Cloud database is empty. Upload the current data to it?'))await cloudPushAll()}else{db=d;save()}
status('ok','Cloud synced');render()}catch(e){status('err','Cloud error');toast(e.message)}}
function settings(){$('#dlg').innerHTML=`<h2>Cloud database (Supabase)</h2><p style="color:var(--muted)">Paste the Project URL and anon public key from Supabase → Project Settings → API. Leave empty to stay local.</p>
<label>Project URL</label><input id="sbu" placeholder="https://xxxx.supabase.co" value="${esc(SB?.url||'')}"><label style="margin-top:8px">anon public key</label><input id="sbk" value="${esc(SB?.key||'')}">
<div class="bar" style="margin-top:14px;justify-content:flex-end"><button class="btn g" onclick="$('#dlg').close()">Close</button><button class="btn d" onclick="sbSave(true)">Disconnect</button><button class="btn" onclick="sbSave()">Save &amp; connect</button></div>`;$('#dlg').showModal()}
function sbSave(off){if(off){SB=null;localStorage.removeItem('safari_sb')}else{SB={url:$('#sbu').value.trim(),key:$('#sbk').value.trim()};localStorage.setItem('safari_sb',JSON.stringify(SB))}$('#dlg').close();initCloud()}
render();initCloud();
/* a11y: link each label to its field inside dialogs */

new MutationObserver(()=>{const d=$('#dlg');if(d.firstElementChild&&!d.querySelector(':scope>.dx'))d.insertAdjacentHTML('afterbegin','<button type="button" class="dx" onclick="$(\'#dlg\').close()" aria-label="Close" title="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>')}).observe($('#dlg'),{childList:true});
let _lid=0;new MutationObserver(()=>{$$('#dlg label').forEach(l=>{const f=l.nextElementSibling;if(f&&/^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)&&!l.htmlFor){f.id=f.id||'f'+(++_lid);l.htmlFor=f.id}})}).observe($('#dlg'),{childList:true,subtree:true});
